name: Lint and Test Charts Memgraph

on:
  pull_request:
    paths:
      - 'charts/memgraph/**'
      - 'scripts/verify-metrics-format.sh'
      - '.github/workflows/lint-test-memgraph.yml'


jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          check-latest: true

      - name: Verify metrics-format pinning
        run: ./scripts/verify-metrics-format.sh

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --check-version-increment false --charts charts/memgraph-lab

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Set up Memgraph environment variables
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          echo "MEMGRAPH_ENTERPRISE_LICENSE=${{ secrets.MEMGRAPH_ENTERPRISE_LICENSE }}" >> $GITHUB_ENV
          echo "MEMGRAPH_ORGANIZATION_NAME=${{ secrets.MEMGRAPH_ORGANIZATION_NAME }}" >> $GITHUB_ENV

      - name: Create Kubernetes secrets
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          kubectl create secret generic memgraph-secrets \
            --from-literal=USER=memgraph \
            --from-literal=PASSWORD=memgraph \
            --namespace default

      - name: Verify Kubernetes secrets
        if: steps.list-changed.outputs.changed == 'true'
        run: kubectl get secrets --namespace default

      - name: Display kubectl context
        if: steps.list-changed.outputs.changed == 'true'
        run: kubectl config current-context

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --target-branch ${{ github.event.repository.default_branch }} --helm-extra-set-args "--set secrets.enabled=true" --excluded-charts memgraph-high-availability,memgraph-lab,memgraph-mcp --namespace default
