{{- if .Values.externalAccessConfig.gateway.enabled }}
{{- include "memgraph.validateExternalAccess" . }}
{{- $gatewayName := .Values.externalAccessConfig.gateway.existingGatewayName | default (printf "%s-gateway" (include "memgraph.fullname" .)) }}
{{- $gatewayNamespace := .Values.externalAccessConfig.gateway.existingGatewayNamespace | default .Release.Namespace }}
{{/*
  A tier whose serviceType is set gets its external access from that service
  type instead — the Gateway only exposes tiers with an empty serviceType.
  Validation above guarantees at least one tier qualifies.
*/}}
{{- $gatewayData := eq (.Values.externalAccessConfig.dataInstance.serviceType | default "") "" }}
{{- $gatewayCoords := eq (.Values.externalAccessConfig.coordinator.serviceType | default "") "" }}
{{- if not .Values.externalAccessConfig.gateway.existingGatewayName }}
{{- if not .Values.externalAccessConfig.gateway.gatewayClassName }}
  {{- fail "externalAccessConfig.gateway.gatewayClassName is required when gateway is enabled and existingGatewayName is not set." }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gatewayName }}
  {{- with .Values.externalAccessConfig.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "memgraph.labels" . | nindent 4 }}
    {{- with .Values.externalAccessConfig.gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  gatewayClassName: {{ .Values.externalAccessConfig.gateway.gatewayClassName }}
  listeners:
  {{- if $gatewayData }}
  {{- range $index, $data := .Values.data }}
    - name: data-{{ $data.id }}-bolt
      protocol: TCP
      port: {{ add (int $.Values.externalAccessConfig.gateway.dataPortBase) (int $data.id) }}
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: TCPRoute
  {{- end }}
  {{- end }}
  {{- if $gatewayCoords }}
  {{- /*
    One shared listener for ALL coordinators (not one per coordinator), on the
    Bolt port: the single TCPRoute below lists every coordinator Service as a
    backendRef, so the Gateway round-robins new connections across them. A
    client only needs one address — host:boltPort, the same port it would use
    in-cluster — and it keeps working when the coordinator it happened to land
    on goes away.
  */}}
    - name: coordinators-bolt
      protocol: TCP
      port: {{ .Values.ports.boltPort }}
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: TCPRoute
  {{- end }}
{{- end }}
{{- if $gatewayData }}
{{- range $index, $data := .Values.data }}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: {{ include "memgraph.fullname" $ }}-data-{{ $data.id }}-bolt
  {{- with $.Values.externalAccessConfig.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "memgraph.labels" $ | nindent 4 }}
    app: memgraph-data-{{ $data.id }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
      sectionName: data-{{ $data.id }}-bolt
  rules:
    - backendRefs:
        - name: memgraph-data-{{ $data.id }}
          port: {{ $.Values.ports.boltPort }}
{{- end }}
{{- end }}
{{- if $gatewayCoords }}
---
{{- /*
  A single TCPRoute for all coordinators. Multiple backendRefs with equal
  (default) weight make the Gateway distribute connections round-robin over the
  coordinator Services, so clients get one stable entrypoint into the cluster
  instead of one address per coordinator.
*/}}
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: {{ include "memgraph.fullname" . }}-coordinators-bolt
  {{- with .Values.externalAccessConfig.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "memgraph.labels" . | nindent 4 }}
    app: memgraph-coordinators
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
      sectionName: coordinators-bolt
  rules:
    - backendRefs:
      {{- range .Values.coordinators }}
        - name: memgraph-coordinator-{{ .id }}
          port: {{ $.Values.ports.boltPort }}
      {{- end }}
{{- end }}
{{- end }}
