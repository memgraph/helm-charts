apiVersion: v2
name: memgraph-operator
description: Kubernetes operator for Memgraph high-availability clusters
type: application
# version is the chart version, appVersion the operator version it installs.
# They move independently: version changes with every chart change, appVersion
# only with an operator release, which tags the commit v<appVersion>.
version: 1.1.0
appVersion: "1.1.0"
# The CustomResourceDefinition uses CEL validation rules
# (x-kubernetes-validations) that compare quantities with the CEL Quantity
# library: Kubernetes 1.27 rejects the CRD (no quantity()), 1.28 rejects
# compareTo(), and 1.29 is the first release that installs it.
kubeVersion: ">=1.29.0-0"
home: https://memgraph.com
icon: https://memgraph.com/images/logo-memgraph-purple.svg
sources:
  - https://github.com/memgraph/kubernetes-operator
keywords:
  - memgraph
  - graph-database
  - high-availability
  - operator
maintainers:
  - name: Memgraph
    url: https://memgraph.com
